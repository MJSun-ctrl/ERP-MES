<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">

<head>
    <th:block th:include="include :: header('销售订单明细列表')" />
</head>

<body class="gray-bg">

<div class="container-div">
    <div class="row">

        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>

                        <li>
                            <label>订购数量：</label>
                            <input type="text" name="quantity"/>
                        </li>

                        <li>
                            <label>要求交货日期：</label>
                            <input type="text"
                                   class="time-input"
                                   placeholder="请选择要求交货日期"
                                   name="deliveryDate"/>
                        </li>

                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm"
                               onclick="$.table.search()">
                                <i class="fa fa-search"></i>&nbsp;搜索
                            </a>

                            <a class="btn btn-warning btn-rounded btn-sm"
                               onclick="$.form.reset()">
                                <i class="fa fa-refresh"></i>&nbsp;重置
                            </a>
                        </li>

                    </ul>
                </div>
            </form>
        </div>


        <div class="btn-group-sm" id="toolbar" role="group">

            <a class="btn btn-success"
               onclick="$.operate.add()"
               shiro:hasPermission="manufacture:item:add">
                <i class="fa fa-plus"></i> 添加
            </a>

            <a class="btn btn-primary single disabled"
               onclick="$.operate.edit()"
               shiro:hasPermission="manufacture:item:edit">
                <i class="fa fa-edit"></i> 修改
            </a>

            <a class="btn btn-danger multiple disabled"
               onclick="$.operate.removeAll()"
               shiro:hasPermission="manufacture:item:remove">
                <i class="fa fa-remove"></i> 删除
            </a>

            <a class="btn btn-warning"
               onclick="$.table.exportExcel()"
               shiro:hasPermission="manufacture:item:export">
                <i class="fa fa-download"></i> 导出
            </a>

        </div>


        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>

    </div>
</div>

<th:block th:include="include :: footer" />

<script th:inline="javascript">

    var editFlag =
        [[${@permission.hasPermi('manufacture:item:edit')}]];

    var removeFlag =
        [[${@permission.hasPermi('manufacture:item:remove')}]];

    var prefix = ctx + "manufacture/item";

    /*
     * 当前销售订单ID
     *
     * 这个值由销售订单页面点击“明细”时传入。
     */
    var orderId = [[${orderId}]];


    $(function() {

        var options = {

            /*
             * 查询当前销售订单的明细
             */
            url: prefix + "/list?orderId=" + orderId,

            /*
             * 新增明细时继续把当前订单ID传递给后端
             */
            createUrl: prefix + "/add?orderId=" + orderId,

            updateUrl: prefix + "/edit/{id}",

            removeUrl: prefix + "/remove",

            exportUrl: prefix + "/export",

            modalName: "销售订单明细",

            columns: [

                {
                    checkbox: true
                },

                {
                    field: 'itemId',
                    title: '订单明细ID',
                    visible: false
                },

                /*
                 * 产品ID不再直接显示。
                 *
                 * productId仍然存在于数据库中，
                 * 这里只显示关联查询得到的产品名称。
                 */
                {
                    field: 'productName',
                    title: '产品'
                },

                {
                    field: 'quantity',
                    title: '订购数量'
                },

                {
                    field: 'deliveryDate',
                    title: '要求交货日期'
                },

                {
                    field: 'remark',
                    title: '备注'
                },

                {
                    title: '操作',
                    align: 'center',

                    formatter: function(value, row, index) {

                        var actions = [];

                        actions.push(
                            '<a class="btn btn-success btn-xs '
                            + editFlag
                            + '" href="javascript:void(0)" '
                            + 'onclick="$.operate.edit(\''
                            + row.itemId
                            + '\')">'
                            + '<i class="fa fa-edit"></i>编辑</a> '
                        );

                        actions.push(
                            '<a class="btn btn-danger btn-xs '
                            + removeFlag
                            + '" href="javascript:void(0)" '
                            + 'onclick="$.operate.remove(\''
                            + row.itemId
                            + '\')">'
                            + '<i class="fa fa-remove"></i>删除</a>'
                        );

                        return actions.join('');
                    }
                }

            ]
        };

        $.table.init(options);
    });

</script>

</body>
</html>
