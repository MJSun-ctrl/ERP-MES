<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改物料清单')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-bom-edit" th:object="${bom}">
            
            <div class="col-xs-12">
    <div class="form-group">
        <label class="col-sm-3 control-label is-required">产品：</label>
        <div class="col-sm-8">
            <select name="productId" 
                    class="form-control" 
                    required>

                <option value="">请选择产品</option>

                <option th:each="product:${products}"
                        th:value="${product.productId}"
                        th:text="${product.productName}"
                        th:selected="${product.productId==bom.productId}">
                </option>

            </select>
        </div>
    </div>
</div>
            
            <input name="bomId" th:field="*{bomId}" type="hidden">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">物料清单编号：</label>
                    <div class="col-sm-8">
                        <input name="bomCode" th:field="*{bomCode}" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">版本号：</label>
                    <div class="col-sm-8">
                        <input name="version" th:field="*{version}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">生效日期：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input name="effectiveDate" th:value="${#dates.format(bom.effectiveDate, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text">
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">备注：</label>
                    <div class="col-sm-8">
                        <textarea name="remark" class="form-control">[[*{remark}]]</textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "manufacture/bom";
        $("#form-bom-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-bom-edit').serialize());
            }
        }

        $("input[name='effectiveDate']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });
    </script>
</body>
</html>
