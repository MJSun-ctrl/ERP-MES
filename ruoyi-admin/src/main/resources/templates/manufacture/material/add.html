<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增物料信息')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-material-add">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">物料编码：</label>
                    <div class="col-sm-8">
                        <input name="materialCode" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">物料名称：</label>
                    <div class="col-sm-8">
                        <input name="materialName" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">规格型号：</label>
                    <div class="col-sm-8">
                        <input name="specification" class="form-control" type="text">
                    </div>
                </div>
            </div>
<div class="col-xs-12">
    <div class="form-group">
        <label class="col-sm-3 control-label">物料类型：</label>
        <div class="col-sm-8">
            <select name="materialType" class="form-control m-b">
                <option value="">请选择物料类型</option>
                <option th:each="dict : ${@dict.getType('material_type')}"
                        th:text="${dict.dictLabel}"
                        th:value="${dict.dictValue}">
                </option>
            </select>
        </div>
    </div>
</div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">计量单位：</label>
                    <div class="col-sm-8">
                        <input name="unit" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">安全库存：</label>
                    <div class="col-sm-8">
                        <input name="safetyStock" class="form-control" type="number" min="0">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
    <div class="form-group">
        <label class="col-sm-3 control-label">状态：</label>
        <div class="col-sm-8">
            <select name="status" class="form-control m-b">
                <option value="">请选择状态</option>
                <option th:each="dict : ${@dict.getType('material_status')}"
                        th:text="${dict.dictLabel}"
                        th:value="${dict.dictValue}">
                </option>
            </select>
        </div>
    </div>
</div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">备注：</label>
                    <div class="col-sm-8">
                        <textarea name="remark" class="form-control"></textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "manufacture/material"
        $("#form-material-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-material-add').serialize());
            }
        }
    </script>
</body>
</html>
