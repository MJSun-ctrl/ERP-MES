<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('修改产品管理')" />
</head>

<body class="white-bg">

    <div class="wrapper wrapper-content animated fadeInRight ibox-content">

        <form class="form-horizontal m"
              id="form-product-edit"
              th:object="${product}">

            <input name="productId"
                   th:field="*{productId}"
                   type="hidden">

            <div class="col-xs-12">
                <div class="form-group">

                    <label class="col-sm-3 control-label is-required">
                        产品编码：
                    </label>

                    <div class="col-sm-8">
                        <input name="productCode"
                               th:field="*{productCode}"
                               class="form-control"
                               type="text"
                               required>
                    </div>

                </div>
            </div>

            <div class="col-xs-12">
                <div class="form-group">

                    <label class="col-sm-3 control-label is-required">
                        产品名称：
                    </label>

                    <div class="col-sm-8">
                        <input name="productName"
                               th:field="*{productName}"
                               class="form-control"
                               type="text"
                               required>
                    </div>

                </div>
            </div>

            <div class="col-xs-12">
                <div class="form-group">

                    <label class="col-sm-3 control-label">
                        规格型号：
                    </label>

                    <div class="col-sm-8">
                        <input name="specification"
                               th:field="*{specification}"
                               class="form-control"
                               type="text">
                    </div>

                </div>
            </div>

            <div class="col-xs-12">
                <div class="form-group">

                    <label class="col-sm-3 control-label">
                        单位：
                    </label>

                    <div class="col-sm-8">
                        <input name="unit"
                               th:field="*{unit}"
                               class="form-control"
                               type="text">
                    </div>

                </div>
            </div>

            <div class="col-xs-12">
                <div class="form-group">

                    <label class="col-sm-3 control-label">
                        备注：
                    </label>

                    <div class="col-sm-8">
                        <textarea name="remark"
                                  class="form-control">[[*{remark}]]</textarea>
                    </div>

                </div>
            </div>

        </form>

    </div>

    <th:block th:include="include :: footer" />

    <script th:inline="javascript">

        var prefix = ctx + "manufacture/product";

        $("#form-product-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(
                    prefix + "/edit",
                    $('#form-product-edit').serialize()
                );
            }
        }

    </script>

</body>
</html>
