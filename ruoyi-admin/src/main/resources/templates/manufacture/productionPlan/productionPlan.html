<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('生产计划列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>计划编号：</label>
                                <input type="text" name="planCode"/>
                            </li>
                            <li>
                                <label>产品ID：</label>
                                <input type="text" name="productId"/>
                            </li>
                            <li>
                                <label>计划数量：</label>
                                <input type="text" name="quantity"/>
                            </li>
                            <li>
                                <label>计划开始日期：</label>
                                <input type="text" class="time-input" placeholder="请选择计划开始日期" name="startDate"/>
                            </li>
                            <li>
                                <label>计划结束日期：</label>
                                <input type="text" class="time-input" placeholder="请选择计划结束日期" name="endDate"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="manufacture:productionPlan:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="manufacture:productionPlan:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="manufacture:productionPlan:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="manufacture:productionPlan:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('manufacture:productionPlan:edit')}]];
        var removeFlag = [[${@permission.hasPermi('manufacture:productionPlan:remove')}]];
        var prefix = ctx + "manufacture/productionPlan";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "生产计划",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'planId',
                    title: '生产计划ID',
                    visible: false
                },
                {
                    field: 'planCode',
                    title: '计划编号'
                },
                {
    field: 'productName',
    title: '产品名称'
},
                {
                    field: 'quantity',
                    title: '计划数量'
                },
                {
                    field: 'startDate',
                    title: '计划开始日期'
                },
                {
                    field: 'endDate',
                    title: '计划结束日期'
                },
                {
                    field: 'status',
                    title: '状态'
                },
                {
                    field: 'remark',
                    title: ''
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        
                        actions.push(
'<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="createOrder(\'' 
+ row.planId +
'\')"><i class="fa fa-gears"></i>生成工单</a>'
);
                        
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.planId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.planId + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);



        });
                    function createOrder(planId)
{
    $.modal.confirm(
        "确认根据该计划生成工单吗？",
        function()
        {
            $.operate.post(
    prefix + "/createOrder/" + planId,
    function(result){

        $.modal.msgSuccess(result.msg);

        $.table.refresh();

    }
);
        }
    )
}
    </script>
</body>
</html>
